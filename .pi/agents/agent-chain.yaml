plan-build-review:
  description: "Planla, uygula, gozden gecir - standart gelistirme dongusu"
  steps:
    - agent: planner
      prompt: "Su is icin uygulama plani hazirla: $INPUT"
    - agent: builder
      prompt: "Asagidaki plani uygula:\n\n$INPUT"
    - agent: reviewer
      prompt: "Bu uygulamayi hata, stil ve dogruluk acisindan incele:\n\n$INPUT"

plan-build:
  description: "Planla sonra uygula - hizli iki adimli gelistirme"
  steps:
    - agent: planner
      prompt: "Su is icin uygulama plani hazirla: $INPUT"
    - agent: builder
      prompt: "Bu plana gore uygula:\n\n$INPUT"

scout-flow:
  description: "Uc asamali kesif - kesfet, dogrula, son kontrol"
  steps:
    - agent: scout
      prompt: "Kod tabanini gez ve su konuyu arastir: $INPUT\n\nBulgulari yapi, kritik dosyalar ve kaliplarla raporla."
    - agent: scout
      prompt: "Asagidaki analizi capraz kontrol et. Eksik, hatali veya yetersiz kisimlari bul:\n\n$INPUT\n\nOrijinal istek: $ORIGINAL"
    - agent: scout
      prompt: "Son kontrol gecisi yap. Asagidaki analiz tam ve dogru mu kontrol et; eksikleri ve duzeltmeleri ekle:\n\n$INPUT\n\nOrijinal istek: $ORIGINAL"

plan-review-plan:
  description: "Yinelemeli planlama - planla, elestir, geri bildirimle iyilestir"
  steps:
    - agent: planner
      prompt: "Su istek icin detayli bir uygulama plani olustur: $INPUT"
    - agent: plan-reviewer
      prompt: "Bu uygulama planini elestirel sekilde incele. Varsayimlari sorgula, bosluklari bul ve iyilestirme oner:\n\n$INPUT\n\nOrijinal istek: $ORIGINAL"
    - agent: planner
      prompt: "Bu elestiriye gore uygulama planini revize et ve guclendir. Belirtilen tum sorunlari ele alip onerileri plana islet:\n\nOrijinal istek: $ORIGINAL\n\nElestiri:\n$INPUT"

full-review:
  description: "Uctan uca pipeline - kesif, planlama, uygulama, inceleme"
  steps:
    - agent: scout
      prompt: "Kod tabanini kesfet ve sunu tespit et: $INPUT"
    - agent: planner
      prompt: "Bu analize dayanarak bir plan olustur:\n\n$INPUT"
    - agent: builder
      prompt: "Bu plani uygula:\n\n$INPUT"
    - agent: reviewer
      prompt: "Bu uygulamayi incele:\n\n$INPUT"
